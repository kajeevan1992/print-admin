[variables]
NODE_ENV = "production"
NPM_CONFIG_PRODUCTION = "false"
PNPM_HOME = "/root/.local/share/pnpm"
PATH = "/root/.local/share/pnpm:/app/node_modules/.bin:$PATH"

[phases.setup]
nixPkgs = ["nodejs_20", "pnpm", "curl", "wget"]

[phases.install]
cmds = [
  "pnpm --version",
  "pnpm config set store-dir /root/.local/share/pnpm/store",
  "pnpm install --no-frozen-lockfile --prefer-offline --shamefully-hoist"
]
cacheDirectories = ["/root/.local/share/pnpm/store"]
paths = ["/app/node_modules/.bin", "/root/.local/share/pnpm"]

[phases.build]
cmds = [
  "test -x /app/node_modules/.bin/next",
  "NEXT_TELEMETRY_DISABLED=1 pnpm run build"
]
cacheDirectories = [".next/cache", "node_modules/.cache"]

[start]
cmd = "NEXT_TELEMETRY_DISABLED=1 pnpm run start"
