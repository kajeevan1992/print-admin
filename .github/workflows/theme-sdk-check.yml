name: Theme SDK check

on:
  pull_request:
    paths:
      - 'app/native-stores/**'
      - 'app/theme-preview/**'
      - 'src/components/layout/app-frame.tsx'
      - 'src/modules/themes/**'
      - 'src/services/themes.service.ts'
      - 'src/theme-runtime/**'
      - 'src/themes/**'
      - 'src/v0-themes/**'
      - 'scripts/create-v0-theme.mjs'
      - 'scripts/validate-v0-themes.mjs'
      - 'package.json'
      - '.github/workflows/theme-sdk-check.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate v0 theme boundaries
        run: pnpm theme:check

      - name: Build
        run: pnpm build
