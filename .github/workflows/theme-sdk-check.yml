name: Theme and storefront safety check

on:
  pull_request:
    paths:
      - 'app/native-stores/**'
      - 'app/theme-preview/**'
      - 'app/api/native-storefront/**'
      - 'app/api/internal/formal-quotes/**'
      - 'app/api/webhooks/stripe/**'
      - 'src/components/layout/app-frame.tsx'
      - 'src/core/payments/**'
      - 'src/core/quotes/**'
      - 'src/core/storefront/**'
      - 'src/modules/operations/pages/quotes-page.tsx'
      - 'src/modules/themes/**'
      - 'src/services/themes.service.ts'
      - 'src/theme-runtime/**'
      - 'src/themes/**'
      - 'src/v0-themes/**'
      - 'scripts/create-v0-theme.mjs'
      - 'scripts/install-v0-theme.mjs'
      - 'scripts/sync-v0-theme-registry.mjs'
      - 'scripts/validate-v0-themes.mjs'
      - 'package.json'
      - '.env.example'
      - '.github/workflows/theme-sdk-check.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Validate v0 theme boundaries
        run: pnpm theme:check

      - name: Validate installed theme registry
        run: pnpm theme:registry:check

      - name: Exercise folder theme installer
        run: pnpm theme:install src/v0-themes/canvas --dry-run --replace

      - name: Exercise ZIP theme installer
        run: |
          cd src/v0-themes
          zip -qr /tmp/canvas-theme.zip canvas
          cd ../..
          pnpm theme:install /tmp/canvas-theme.zip --dry-run --replace

      - name: Build
        run: pnpm build
